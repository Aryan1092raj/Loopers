# Deploys frontend/ to Vercel: production on push to main, preview on pull requests.
# Needs secrets in the "Production" environment: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, and the Vercel project's
# Root Directory set to "frontend". Vercel builds the app itself, so build-time env (API_URL, MEDIA_URL, NEXT_MOCK) is
# read from the project settings, including variables saved as secrets. `vercel pull` cannot read those and fails the build.
name: Frontend → Vercel

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-vercel.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-vercel.yml"]

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck and lint
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint

      - run: npm i -g vercel@latest

      - name: Deploy
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            url=$(vercel deploy --prod --yes)
          else
            url=$(vercel deploy --yes)
          fi
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
