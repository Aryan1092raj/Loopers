# Deploys frontend/ to Vercel: production on push to main, preview on pull requests.
# Needs repo secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, and the Vercel project's
# Root Directory set to "frontend". Build-time env (API_URL, NEXT_PUBLIC_MOCK) comes from the
# Vercel project settings through `vercel pull`.
name: Frontend → Vercel

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-vercel.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-vercel.yml"]

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Typecheck and lint
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint

      - run: npm i -g vercel@latest

      - name: Deploy
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            vercel pull --yes --environment=production
            vercel build --prod
            url=$(vercel deploy --prebuilt --prod)
          else
            vercel pull --yes --environment=preview
            vercel build
            url=$(vercel deploy --prebuilt)
          fi
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
