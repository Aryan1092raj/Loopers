# Full Loopers stack: Next.js frontend, FastAPI backend, Qdrant, optional Whisper server.
#
#   cp RAG_DB/.env.example RAG_DB/.env      # add LLM keys
#   docker compose -f docker-compose.app.yml up -d --build
#   open http://localhost:3000              # API docs: http://localhost:8000/docs
#
# Ingest or embed inside the api container (data persists in the named volumes):
#   docker compose -f docker-compose.app.yml run --rm api python src/pipeline.py embed
#
# Whisper server (profile "asr", CPU): add --profile asr. The api posts to it at WHISPER_SERVER_URL below and
# falls back to in-process faster-whisper when it is not running.
#
# Docker Desktop runs containers in a small VM with no GPU, so this stack is CPU-only and `embed` can be
# OOM-killed ("embed exited with code -9") when the VM has under ~6 GB. For GPU embedding and transcription run
# the api and whisper natively and keep only qdrant here; see "Run with Docker" in README.md.
#
# This file is separate from docker-compose.yml / docker-compose.rag.yml, which belong to the Content Studio image.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.6
    restart: unless-stopped
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./RAG_DB
      dockerfile: Dockerfile.app
    restart: unless-stopped
    env_file:
      - path: ./RAG_DB/.env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      WHISPER_SERVER_URL: http://whisper:8300/v1/audio/transcriptions
      LOOPERS_VISUAL_RETRIEVAL: ${LOOPERS_VISUAL_RETRIEVAL:-0}  # 1 = page-image retrieval (ColSmol + EmbeddingGemma)
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - app-raw:/app/raw
      - app-processed:/app/processed
      - app-metadata:/app/metadata
      - app-output:/app/output
      - hf-models:/models
    depends_on:
      qdrant:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        API_URL: http://api:8000
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  whisper:
    profiles: ["asr"]
    build: ./whisper-server
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
    volumes:
      - hf-models:/models

volumes:
  qdrant-storage:
  app-raw:
  app-processed:
  app-metadata:
  app-output:
  hf-models:
