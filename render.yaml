# Render Blueprint for the Loopers API: builds RAG_DB/Dockerfile.render straight from this GitHub repo.
# The image bakes in RAG_DB/deploy_data/ (course metadata, rendered pages, source files), so that folder must be committed.
# Refresh it with: cd RAG_DB && bash export_deploy_data.sh
# Secrets (sync: false) are entered in the dashboard on first sync; they never live in this file.
services:
  - type: web
    name: loopers-api
    runtime: docker
    dockerfilePath: ./RAG_DB/Dockerfile.render
    dockerContext: ./RAG_DB
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: EMBED_MODEL
        value: google/embeddinggemma-2
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: COLLECTION
        value: multimodal_hackathon
      # GPU worker on Lightning (ngrok URL) and the shared key; unset means models run on this host.
      - key: WORKER_URL
        sync: false
      - key: WORKER_KEY
        sync: false
